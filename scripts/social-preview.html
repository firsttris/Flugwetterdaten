<!doctype html>
<!-- Social Preview des Repositorys (Settings → Social preview), 1280×640. Wird von
     scripts/screenshots.mjs zu docs/social-preview.png, mit dem Handy-Bild aus docs/. -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Geist'; font-weight: 100 900; src: url(data:font/woff2;base64,FONT_WOFF2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 640px; overflow: hidden; font-family: 'Geist', sans-serif; color: #fafafa; position: relative;
  background: radial-gradient(760px 460px at 12% 0%, rgba(34,184,214,.22), transparent 70%), linear-gradient(135deg, #0f1418, #09090b); }
body::before { content: ''; position: absolute; inset: 0; opacity: .5;
  background-image: repeating-linear-gradient(-28deg, transparent 0 46px, rgba(34,184,214,.06) 46px 47px); }
.wrap { position: relative; display: grid; grid-template-columns: 1fr 420px; height: 100%; padding: 0 90px; align-items: center; gap: 40px; }
.head { display: flex; align-items: center; gap: 22px; }
.logo svg { width: 92px; height: 92px; display: block; filter: drop-shadow(0 0 32px rgba(34,184,214,.35)); }
h1 { font-size: 64px; font-weight: 650; letter-spacing: -2px; line-height: 1; }
h1 span { display: block; font-size: 26px; font-weight: 500; letter-spacing: 0; color: #a1a1aa; margin-top: 10px; }
.tag { margin-top: 34px; font-size: 30px; line-height: 1.3; font-weight: 600; max-width: 600px; }
.tag b { color: #4ade80; font-weight: 600; }
.chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 620px; }
.chip { font-size: 17px; color: #d4d4d8; background: #18181b; border: 1px solid #27272a; border-radius: 999px; padding: 7px 15px; }
.phone { justify-self: end; width: 340px; height: 560px; border-radius: 44px; overflow: hidden; border: 10px solid #1f1f23; margin-top: 140px;
  box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px #2a2a30; }
.phone img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="head"><div class="logo">ICON_SVG</div><h1>Wetter Rampe<span>NATO-Rampe Rheinmünster</span></h1></div>
    <p class="tag">Wind, Vorhersage und Rhein-Pegel auf einen Blick. <b>Mit Wind-Alarm aufs Handy.</b></p>
    <div class="chips">
      <span class="chip">METAR Baden-Airpark</span><span class="chip">Vorhersage 5 Tage</span>
      <span class="chip">Pegel Iffezheim</span><span class="chip">Wassertemperatur</span><span class="chip">App fürs Handy</span>
    </div>
  </div>
  <div class="phone"><img src="PHONE_PNG" alt=""></div>
</div>
</body>
</html>
