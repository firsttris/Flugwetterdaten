name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf einen Pull Request bricht den veralteten Lauf ab; Läufe auf main laufen zu Ende
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Entwürfe bauen nicht; „Ready for review“ startet den Lauf
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
