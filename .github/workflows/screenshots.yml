name: Update screenshots

# Nimmt die Bilder in docs/ (README, Doku, Social Preview) und public/screenshots/ (App-Manifest) mit
# den Demo-Daten aus scripts/demo-data.mjs neu auf und committet die geänderten.
# Nach einer sichtbaren Änderung von Hand starten.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # Das Bun aus packageManager in package.json, wie setup-bun es in ci.yml nimmt; das Image hat
      # npm und node, aber kein unzip für Buns Installer und kein jq (nicht der Eingang
      # `bun-version` des Workflows, der eine zweite Stelle für die Version wäre)
      install: >-
        npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        && bun install --frozen-lockfile
      lockfile: bun.lock
      command: bun run screenshots
      paths: |
        docs/*.png
        public/screenshots
    permissions:
      contents: write
