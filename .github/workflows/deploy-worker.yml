name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Das Bun aus packageManager in package.json (im Wurzelverzeichnis, nicht in worker/)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      - name: Worker hochladen
        run: bunx wrangler deploy

      # Privater VAPID-Schlüssel für den Wind-Alarm, nur wenn das Secret gesetzt ist
      - name: VAPID-Schlüssel setzen
        if: env.VAPID_PRIVATE_KEY != ''
        run: printf '%s' "$VAPID_PRIVATE_KEY" | bunx wrangler secret put VAPID_PRIVATE_KEY
