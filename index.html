<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wetter NATO-Rampe Rheinmünster</title>
    <meta name="description" content="Wind, Vorhersage und Rhein-Pegel an der NATO-Rampe Rheinmünster, mit Wind-Alarm aufs Handy." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wetter Rampe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Wetter NATO-Rampe Rheinmünster" />
    <meta property="og:description" content="Wind, Vorhersage und Rhein-Pegel an der NATO-Rampe Rheinmünster." />
    <meta property="og:image" content="https://wetter.teufel-it.de/icons/icon-512.png" />
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt
      try {
        var t = JSON.parse(localStorage.getItem("rm-settings") || "{}").theme;
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
